<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Waghoba Eco Lodge | Fantasists Production</title>
  <meta name="description" content="Cinematic films created for Waghoba Eco Lodge, Tadoba.">

  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'Figtree', sans-serif;
      font-weight: 400;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* NAVIGATION */

    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 30px 60px;
      mix-blend-mode: normal;
      background: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
    }

  .nav-logo img {
    width: 70px;
  height: auto;
    display: block;
}

   .nav-links {
    display: flex;
    gap: 48px;
    align-items: center;
}

  .nav-links a {
    color: var(--white);
    text-decoration: none;
    font-family: 'Figtree', sans-serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.12em;
    opacity: 0.85;
    transition: opacity 0.2s;
    padding: 25px 50px;
}

    .nav-links a:hover {
      color: #fff;
    }

    /* PROJECT HEADER */

    .project-header {
      padding: 180px 40px 80px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .project-number {
      font-size: 10px;
      letter-spacing: 4px;
      color: #666;
      margin-bottom: 28px;
    }

    .project-title {
      font-size: clamp(48px, 7vw, 96px);
      line-height: 0.98;
      font-weight: 400;
      letter-spacing: -3px;
      max-width: 1000px;
    }

    .project-location {
      margin-top: 28px;
      font-size: 12px;
      letter-spacing: 1px;
      color: #777;
    }

    /* HERO VIDEO */

    .project-video {
      width: 100%;
      background: #000;
    }

    .project-video video {
      display: block;
      width: 100%;
      height: auto;
    }

    /* DESCRIPTION */

    .project-description {
      max-width: 900px;
      margin: 0 auto;
      padding: 140px 40px 180px;
    }

    .project-description-label {
      font-size: 10px;
      letter-spacing: 4px;
      color: #666;
      margin-bottom: 35px;
    }

    .project-description p {
      font-size: clamp(22px, 3vw, 36px);
      line-height: 1.35;
      font-weight: 300;
      color: #ddd;
      max-width: 850px;
    }

    /* FOOTER */

    .project-footer {
      border-top: 1px solid #181818;
      padding: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .project-footer a {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #888;
      transition: color 0.3s ease;
    }

    .project-footer a:hover {
      color: #fff;
    }

    .copyright {
      font-size: 10px;
      letter-spacing: 2px;
      color: #555;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .nav {
        height: 75px;
        padding: 0 22px;
      }

      .nav-logo img {
        width: 30px;
      }

      .nav-links {
        gap: 20px;
      }

      .nav-links a {
        font-size: 8px;
        letter-spacing: 1.3px;
      }

      .project-header {
        padding: 140px 22px 60px;
      }

      .project-title {
        font-size: 48px;
        letter-spacing: -1.5px;
      }

      .project-description {
        padding: 100px 22px 120px;
      }

      .project-description p {
        font-size: 23px;
      }

      .project-footer {
        padding: 30px 22px;
      }
    }

/* HOMEPAGE NAVIGATION MATCH */

.nav {
    height: 90px;
    padding: 0 42px;
}

.nav-links {
    display: flex;
    gap: 48px;
    align-items: center;
}

.nav-links a {
    color: var(--white) !important;
    text-decoration: none;
    font-family: 'Figtree', sans-serif;
    font-size: 13px !important;
    font-weight: 400;
    letter-spacing: 0.12em !important;
    text-transform: uppercase !important;
    opacity: 0.85;
    transition: opacity 0.2s;
    padding: 25px 50px;
}

.nav-links a:hover {
    opacity: 1;
}

  </style>
</head>

<body>

  <!-- NAVIGATION -->

  <nav class="nav">

    <a href="index.html" class="nav-logo">
      <img src="logo.png" alt="Fantasists Production">
    </a>

    <div class="nav-links">
      <a href="index.html#work">Work</a>
      <a href="index.html#stills">Stills</a>
      <a href="index.html#services">Services</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </div>

  </nav>


  <!-- PROJECT HEADER -->

  <header class="project-header">

    <div class="project-number">
      05 / SELECTED WORK
    </div>

   <h1 class="project-title">
  Waghoba Eco Lodge
</h1>

    <div class="project-location">
      Tadoba, India
    </div>

  </header>


  <!-- FILM -->

  <section class="project-video">

  <video controls playsinline>
    <source src="waghoba-brand.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

</section>

<section class="project-video">

  <video controls playsinline>
    <source src="waghoba-hero.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

</section>


  <!-- PROJECT DESCRIPTION -->

  <section class="project-description">

    <div class="project-description-label">
      WAGHOBA ECO LODGE
    </div>

    <p>
      A cinematic visual story capturing the wilderness,
  architecture and intimate character of Waghoba Eco Lodge
  in the heart of Tadoba.
    </p>

  </section>


  <!-- FOOTER -->

  <footer class="project-footer">

    <a href="index.html#work">
      ← Back to Work
    </a>

    <div class="copyright">
      © 2026 FANTASISTS PRODUCTION
    </div>

  </footer>

</body>
</html>
